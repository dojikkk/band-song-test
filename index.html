<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>밴드 곡 순위 매기기</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root {
    --bg: #131118; --panel: #1C1923; --panel-2: #242030;
    --line: #322D40; --text: #F1EEE8; --text-2: #A79FB8; --text-3: #6B6480;
    --spot: #FFB454; --spot-deep: #2E2417;
    --violet: #A28BF0; --violet-deep: #221D33;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0B0A0E;
    font-family: "Pretendard Variable", Pretendard, sans-serif;
    color: var(--text);
    display: flex; justify-content: center;
    min-height: 100vh; padding: 20px 0;
    overflow-x: hidden;            /* 가로 삐져나감 방지 */
  }
  .phone {
    position: relative;            /* 숨긴 플레이어의 기준점 */
    width: 100%; max-width: 390px; /* 좁은 폰에서 뷰포트를 넘지 않게 */
    background: var(--bg);
    border-radius: 26px; border: 1px solid var(--line);
    overflow: hidden;
    display: flex; flex-direction: column;
    min-height: 720px;
  }
  @media (max-width: 420px) {
    body { padding: 0; }
    .phone { border-radius: 0; border: none; min-height: 100vh; }
  }

  /* ── 숨긴 유튜브 우리(cage) ──
     플레이어는 240x240으로 정상 생성(유튜브 최소크기 충족),
     부모가 1px로 잘라내서 유저 눈엔 안 보임.
     .phone(position:relative) 안에 있어서 회전/스크롤에 안 어긋남. */
  .yt-cage {
    position: absolute; top: 0; left: 0;
    width: 1px; height: 1px;
    overflow: hidden;
    z-index: -1; pointer-events: none;
  }
  .yt-cage.reveal {
    width: 240px; height: 240px;
    z-index: 50; top: 12px; left: 12px;
    outline: 3px dashed var(--spot);
    border-radius: 8px;
  }
  #ytplayer { width: 240px; height: 240px; border: 0; }

  header { padding: 20px 20px 14px; border-bottom: 1px solid var(--line); }
  .h-title { font-size: 18px; font-weight: 800; letter-spacing: -0.02em; }
  .h-sub { font-size: 12px; color: var(--text-3); margin-top: 4px; line-height: 1.5; }

  main { flex: 1; overflow-y: auto; padding: 16px; }

  .card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 14px; padding: 14px; margin-bottom: 12px;
  }
  .card.active { border-color: var(--violet); }
  .card-top { display: flex; gap: 12px; align-items: center; }
  .art {
    width: 54px; height: 54px; border-radius: 10px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 24px; position: relative; overflow: hidden;
  }
  .art .ring {
    position: absolute; inset: 0; border-radius: 10px;
    border: 2px solid transparent;
  }
  .card.playing .art .ring {
    border-color: var(--violet);
    animation: spin 2s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .meta { flex: 1; min-width: 0; }
  .song-title { font-size: 14.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .song-sub { font-size: 12px; color: var(--text-3); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hl-tag {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 11px; font-weight: 600; color: var(--violet);
    background: var(--violet-deep); border: 1px solid #35304D;
    padding: 3px 8px; border-radius: 999px; margin-top: 5px;
    font-family: ui-monospace, monospace;
  }

  .play-btn {
    width: 44px; height: 44px; border-radius: 50%; flex-shrink: 0;
    border: none; cursor: pointer;
    background: var(--spot); color: #1A1206;
    display: flex; align-items: center; justify-content: center;
    transition: transform .1s;
  }
  .play-btn:active { transform: scale(0.9); }

  /* 파형 */
  .wave { display: flex; align-items: flex-end; gap: 2px; height: 34px; margin-top: 12px; }
  .wave span { flex: 1; background: #3B3552; border-radius: 2px; min-height: 12%; transition: background .12s; }
  .wave span.played { background: var(--violet); }
  .time {
    display: flex; justify-content: space-between;
    font-family: ui-monospace, monospace; font-size: 11px;
    color: var(--text-3); margin-top: 6px;
  }
  .err { font-size: 12px; color: #FF8A7A; margin-top: 10px; display: none; }
  .err.show { display: block; }

  /* 점수 매기기 (1~5, 중복 불가) */
  .score { display: flex; align-items: center; gap: 6px; margin-top: 12px; }
  .score .lbl { font-size: 11px; color: var(--text-3); flex-shrink: 0; margin-right: 2px; }
  .sc {
    flex: 1; height: 34px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--bg);
    color: var(--text-2); font-family: inherit; font-size: 14px; font-weight: 700;
    cursor: pointer; transition: background .12s, color .12s, opacity .12s, transform .1s;
  }
  .sc:active { transform: scale(0.92); }
  .sc.taken { opacity: .3; }                              /* 다른 곡이 가져간 점수 */
  .sc.sel { background: var(--spot); color: #1A1206; border-color: var(--spot); opacity: 1; }

  /* 내 순위 결과 */
  .result {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 14px; padding: 14px; margin-top: 4px;
  }
  .result h3 { font-size: 13px; font-weight: 800; margin-bottom: 4px; }
  .rank-empty { font-size: 12px; color: var(--text-3); line-height: 1.5; margin-top: 6px; }
  .rank-row {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 0; border-top: 1px solid var(--line); font-size: 13.5px;
  }
  .rank-badge {
    width: 24px; height: 24px; border-radius: 7px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 12px;
    background: var(--violet-deep); color: var(--violet);
  }
  .rank-row.top .rank-badge { background: var(--spot-deep); color: var(--spot); }
  .rank-name { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rank-pt { color: var(--spot); font-weight: 800; font-family: ui-monospace, monospace; flex-shrink: 0; }

  .debug-bar {
    position: sticky; bottom: 0;
    background: var(--panel-2); border-top: 1px solid var(--line);
    padding: 12px 16px; display: flex; align-items: center; gap: 10px;
    font-size: 12px; color: var(--text-3);
  }
  .debug-btn {
    font-family: inherit; font-size: 12px; font-weight: 700;
    background: var(--bg); color: var(--text-2);
    border: 1px solid var(--line); border-radius: 8px;
    padding: 8px 12px; cursor: pointer; white-space: nowrap;
  }
  .debug-btn.on { background: var(--spot); color: #1A1206; border-color: var(--spot); }
  #status { flex: 1; text-align: right; font-family: ui-monospace, monospace; }
</style>
</head>
<body>
<div class="phone" id="phone">

  <!-- 숨긴 유튜브 플레이어 (여기 딱 하나, 곡끼리 공유) -->
  <div class="yt-cage" id="ytCage"><div id="ytplayer"></div></div>

  <header>
    <div class="h-title">🎸 우리 밴드 다음 곡 정하기</div>
    <div class="h-sub">5곡 하이라이트 들어보고 <b>1~5점</b>을 매겨줘.<br>점수는 곡마다 <b>중복 없이</b> 한 번씩만 (5점 = 제일 하고 싶은 곡).</div>
  </header>

  <main id="list"></main>

  <div class="debug-bar">
    <button class="debug-btn" id="dbg" onclick="toggleReveal()">🐛 숨긴 플레이어 보기</button>
    <span id="status">준비 중…</span>
  </div>
</div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
// ── 밴드 후보 곡 (유튜브 링크에서 제목·아티스트 가져옴) ──
const songs = [
  { id:'s1', title:'115만 킬로의 필름', sub:'Official髭男dism', vid:'cFANezsSHFo', start:65, end:95, emoji:'🎬', color:'#2A2440' },
  { id:'s2', title:'고민중독',          sub:'QWER',             vid:'hFTs6HbtxbE', start:47, end:72, emoji:'🐞', color:'#183322' },
  { id:'s3', title:'Highlight',        sub:'TOUCHED',          vid:'L5Ba-pp3Qw0', start:45, end:72, emoji:'✨', color:'#33280F' },
  { id:'s4', title:'Syringe',          sub:'Redoor',           vid:'uVs0tqOck7k', start:50, end:78, emoji:'💉', color:'#17293D' },
  { id:'s5', title:'Blue Spring',      sub:'THORNAPPLE',       vid:'8i-B1ieI_kY', start:60, end:90, emoji:'🌱', color:'#142B26' },
];

// 곡별 점수: id -> 1~5 (중복 불가) 또는 null
const scores = {};
songs.forEach(s => scores[s.id] = null);

let player, ready=false, active=null, timer=null;

// 재생/정지 아이콘 — 이모지(▶/❚❚)는 기기마다 컬러 이모지로 깨져서 SVG로 고정
const ICON_PLAY  = '<svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>';
const ICON_PAUSE = '<svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>';

function setStatus(t){ document.getElementById('status').textContent = t; }

// 유튜브 API 준비되면 호출됨
function onYouTubeIframeAPIReady(){
  player = new YT.Player('ytplayer', {
    width:240, height:240, videoId:'',
    playerVars:{ controls:0, rel:0, playsinline:1, modestbranding:1, iv_load_policy:3 },
    events:{
      onReady: ()=>{ ready=true; setStatus('준비 완료'); },
      onStateChange: onState,
      onError: onErr,
    }
  });
}

function onState(e){
  const card = active && document.querySelector(`[data-card="${active.id}"]`);
  if(!card) return;
  if(e.data === YT.PlayerState.PLAYING){ card.classList.add('playing'); setStatus('재생 중 ▶'); }
  if(e.data === YT.PlayerState.PAUSED){ card.classList.remove('playing'); }
  if(e.data === YT.PlayerState.ENDED){ stopAll(); }
}

function onErr(){
  if(!active) return;
  const err = document.querySelector(`[data-card="${active.id}"] .err`);
  if(err) err.classList.add('show');
  setStatus('임베드 차단됨 ✕');
  stopAll();
}

function stopAll(){
  if(timer){ clearInterval(timer); timer=null; }
  if(player && player.pauseVideo) try{ player.pauseVideo(); }catch(e){}
  document.querySelectorAll('.card').forEach(c=>{ c.classList.remove('playing','active'); });
  document.querySelectorAll('.play-btn').forEach(b=> b.innerHTML=ICON_PLAY);
  active=null;
}

function playSong(s){
  if(!ready){ setStatus('아직 준비 중…'); return; }
  // 같은 곡 다시 누르면 정지 토글
  if(active && active.id===s.id){ stopAll(); return; }
  stopAll();
  active = s;
  const card = document.querySelector(`[data-card="${s.id}"]`);
  if(!card){ setStatus('카드를 찾을 수 없음 ✕'); active=null; return; }  // 안전장치
  const btn = card.querySelector('.play-btn');
  const err = card.querySelector('.err');
  err.classList.remove('show');
  card.classList.add('active');
  btn.innerHTML=ICON_PAUSE;
  setStatus('불러오는 중…');

  // 하이라이트 시작 지점부터 재생
  player.loadVideoById({ videoId:s.vid, startSeconds:s.start, endSeconds:s.end });
  player.playVideo();

  // 진행 감시: 파형 채우고, 끝 시각 넘으면 정지
  const bars = card.querySelectorAll('.wave span');
  const curEl = card.querySelector('.cur');
  timer = setInterval(()=>{
    if(!player.getCurrentTime) return;
    const t = player.getCurrentTime();
    const prog = Math.max(0, Math.min(1, (t - s.start)/(s.end - s.start)));
    const lit = Math.floor(prog * bars.length);
    bars.forEach((b,i)=> b.classList.toggle('played', i<lit));
    curEl.textContent = fmt(t);
    if(t >= s.end){ stopAll(); setStatus('구간 끝 · 자동 정지 ✓'); }
  }, 250);
}

function fmt(s){ s=Math.floor(s); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }

// ── 점수 매기기 (1~5, 곡끼리 중복 불가) ──
function setScore(id, v){
  if(scores[id] === v){
    scores[id] = null;                 // 같은 점수 다시 누르면 해제
  } else {
    // 이미 다른 곡이 그 점수를 갖고 있으면 뺏어옴 (항상 중복 없음 보장)
    for(const k in scores){ if(scores[k] === v) scores[k] = null; }
    scores[id] = v;
  }
  renderScores();
  renderResult();
}

function renderScores(){
  songs.forEach(s=>{
    const row = document.querySelector(`[data-score-for="${s.id}"]`);
    if(!row) return;
    row.querySelectorAll('.sc').forEach(b=>{
      const v = Number(b.dataset.v);
      const mine = scores[s.id] === v;
      const takenElsewhere = Object.keys(scores).some(k => k!==s.id && scores[k]===v);
      b.classList.toggle('sel', mine);
      b.classList.toggle('taken', !mine && takenElsewhere);
    });
  });
}

function renderResult(){
  const scored = songs
    .filter(s => scores[s.id] != null)
    .sort((a,b) => scores[b.id] - scores[a.id]);   // 높은 점수 = 1위
  const el = document.getElementById('result');
  if(scored.length === 0){
    el.innerHTML = `<h3>🏆 내 순위</h3>
      <div class="rank-empty">아직 점수를 안 매겼어요.<br>곡마다 1~5점을 눌러보면 여기 순위가 정리돼요.</div>`;
    return;
  }
  el.innerHTML = `<h3>🏆 내 순위 <span style="color:var(--text-3);font-weight:500">(${scored.length}/5)</span></h3>` +
    scored.map((s,i)=> `
      <div class="rank-row${i===0?' top':''}">
        <span class="rank-badge">${i+1}</span>
        <span class="rank-name">${s.title} <span style="color:var(--text-3)">· ${s.sub}</span></span>
        <span class="rank-pt">${scores[s.id]}점</span>
      </div>`).join('');
}

// 회전/리사이즈 안전장치: 위치는 부모가 잡아줘서 안 어긋남.
// 혹시 재생이 끊기면 현재 위치로 다시 이어붙임.
let lastT=0;
setInterval(()=>{ if(player&&player.getCurrentTime&&active) lastT=player.getCurrentTime(); }, 500);
window.addEventListener('orientationchange', ()=>{
  if(!active) return;
  setTimeout(()=>{
    if(player.getPlayerState && player.getPlayerState()!==YT.PlayerState.PLAYING){
      try{ player.seekTo(lastT,true); player.playVideo(); }catch(e){}
    }
  }, 400);
});

function toggleReveal(){
  const cage=document.getElementById('ytCage'), btn=document.getElementById('dbg');
  cage.classList.toggle('reveal'); btn.classList.toggle('on');
}

// ── 렌더 ──
function cardHTML(s){ return `
    <div class="card" data-card="${s.id}">
      <div class="card-top">
        <div class="art" style="background:${s.color}"><div class="ring"></div>${s.emoji}</div>
        <div class="meta">
          <div class="song-title">${s.title}</div>
          <div class="song-sub">${s.sub}</div>
          <span class="hl-tag">✦ ${fmt(s.start)}–${fmt(s.end)}</span>
        </div>
        <button class="play-btn" onclick='playSong(${JSON.stringify(s)})'>${ICON_PLAY}</button>
      </div>
      <div class="wave">${Array.from({length:28},(_,i)=>`<span style="height:${20+Math.abs(Math.sin(i*1.6+s.start))*75}%"></span>`).join('')}</div>
      <div class="time"><span class="cur">0:00</span><span>${fmt(s.end)}</span></div>
      <div class="score" data-score-for="${s.id}">
        <span class="lbl">점수</span>
        ${[1,2,3,4,5].map(v=>`<button class="sc" data-v="${v}" onclick="setScore('${s.id}',${v})">${v}</button>`).join('')}
      </div>
      <div class="err">⚠ 이 영상은 임베드가 막혀있어요 (다른 링크로 바꿔야 해요)</div>
    </div>`; }

function render(){
  document.getElementById('list').innerHTML =
    songs.map(cardHTML).join('') +
    `<div class="result" id="result"></div>`;
  renderScores();
  renderResult();
}
render();
</script>
</body>
</html>
